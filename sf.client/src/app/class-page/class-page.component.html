<div class="card m-5 shadow-sm border border-success">
    <div class="row g-0">
      <h3 class="text-center text-success mt-2">Suchen Sie Klasses:</h3>
      <form class="m-2 row">

        <div class="form-group col">
          <label for="name">Klassen Name</label>
          <input type="text" class="form-control" id="name" [(ngModel)]="searchName" placeholder="Enter Name" name="name">
        </div>

      </form>
      <div class="row">
        <button type="button" class="btn btn-success m-5 col-2" (click)="searchClass()">Suchen</button>
   <!--     <button type="button" class="btn btn-success m-5 col-2" (click)="toggleAddClassForm()">Hinzufügen</button> -->
        <button *ngIf="showSearchResults" type="button" class="btn btn-danger m-5 col-2" (click)="deleteClass()">Löschen</button>
      </div>

    </div>


<!-- Show Table for Class Data -->
<div *ngIf="showSearchResults && allUsers.data.length > 0" class="mat-elevation-z8">
    <table mat-table [dataSource]="allUsers" class="mat-table">
       <!-- Checkbox Column
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let class">
        <input 
          type="checkbox" 
          *ngIf="class" 
          (change)="onCheckboxChange(class, $event)">
      </td>
    </ng-container>  -->
      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let class"> {{class.id}} </td>
      </ng-container>
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>     
        <td mat-cell *matCellDef="let class">
          {{ class.name }}
        </td>
              </ng-container>

     <!-- Führer Colum -->
<!-- User Column -->
<ng-container matColumnDef="tutor">
  <th mat-header-cell *matHeaderCellDef>Tutor </th>
  <td mat-cell *matCellDef="let class">

  <ng-container *ngFor="let tutor of class.tutors; let last = last">
    {{ tutor.firstName }} {{ tutor.lastName }}<span *ngIf="!last">, </span>
  </ng-container>
</td>
</ng-container>
      <!-- Points Column -->
      <ng-container matColumnDef="student">
        <th mat-header-cell *matHeaderCellDef> Students </th>
        <td mat-cell *matCellDef="let class">
          <ng-container *ngFor="let student of class.students; let last = last">
            {{ student.firstName }} {{ student.lastName }}<span *ngIf="!last">, </span>
          </ng-container>
        </td>
      </ng-container>
      

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>
</div>

<!-- Add Class Form -->
<div *ngIf="showAddClassForm" class="row m-1">
  <h3>Add New Class</h3>
  <form (ngSubmit)="addClass()">
    <mat-form-field>
      <input matInput placeholder="ID" [(ngModel)]="newClass.id" name="id" required>
    </mat-form-field><br>
    <mat-form-field>
      <input matInput placeholder="name" [(ngModel)]="newClass.name" name="name" required>
    </mat-form-field><br>
    <button type="button" class="btn btn-success m-5 col-2" (click)="addClass()">Add Class</button>
  </form>
</div>
