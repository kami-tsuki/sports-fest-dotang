<div class="card m-5 shadow-sm border border-success">
    <div class="row g-0">
      <h3 class="text-center text-success mt-2">Suchen Sie Teams:</h3>
      <form class="m-2 row">

        <div class="form-group col">
          <label for="name">Name</label>
          <input type="text" class="form-control" id="name" [(ngModel)]="searchName" placeholder="Enter Name" name="name">
        </div>

      </form>
      <div class="row">
        <button type="button" class="btn btn-success m-5 col-2" (click)="searchTeam()">Suchen</button>
        <button type="button" class="btn btn-success m-5 col-2" (click)="toggleAddTeamForm()">Hinzufügen</button>
        <button *ngIf="showSearchResults" type="button" class="btn btn-danger m-5 col-2" (click)="deleteTeam()">Löschen</button>
      </div>

    </div>


<!-- Show Table for Team Data -->
<div *ngIf="showSearchResults && allTeam.data.length > 0" class="mat-elevation-z8">
    <table mat-table [dataSource]="allTeam" class="mat-table">
       <!-- Checkbox Column -->
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let team">
        <input 
          type="checkbox" 
          *ngIf="team" 
          (change)="onCheckboxChange(team, $event)">
      </td>
    </ng-container>
      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let teams"> {{teams.id}} </td>
      </ng-container>
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        
        <td mat-cell *matCellDef="let teams">
          {{ teams.name }}
        </td>
              </ng-container>
      
      <!-- Deciplien Column -->
      <ng-container matColumnDef="deciplien">
        <th mat-header-cell *matHeaderCellDef> Deciplien </th>
        <td mat-cell *matCellDef="let teams"> {{getDisciplineNames(teams)}} </td>
      </ng-container>
     <!-- Führer Colum -->
<!-- User Column -->
<ng-container matColumnDef="fuhrer">
  <th mat-header-cell *matHeaderCellDef> Führer </th>
  <td mat-cell *matCellDef="let teams"> 
    {{ teams.fuhrer }} 
  </td>
</ng-container>

      <!-- Points Column -->
      <ng-container matColumnDef="point">
        <th mat-header-cell *matHeaderCellDef> Points </th>
        <td mat-cell *matCellDef="let teams"> {{teams.point}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>
</div>

<!-- Add teams Form -->
<div *ngIf="showAddTeamForm" class="row m-1">
  <h3>Add New teams</h3>
  <form (ngSubmit)="addTeam()">
    <mat-form-field>
      <input matInput placeholder="ID" [(ngModel)]="newTeam.id" name="id" required>
    </mat-form-field><br>
    <mat-form-field>
      <input matInput placeholder="name" [(ngModel)]="newTeam.name" name="name" required>
    </mat-form-field><br>
    <mat-form-field>
      <mat-label>Select Discipline</mat-label>
      <mat-select [(ngModel)]="selectedDiscipline" name="discipline">
        <mat-option *ngFor="let discipline of allDisciplines" [value]="discipline">
          {{ discipline.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <br>
    <mat-form-field>
      <input matInput placeholder="Fuhrer" [(ngModel)]="newTeam.fuhrer" name="fuhrer" required>
    </mat-form-field><br>
    <mat-form-field>
      <input matInput placeholder="point" [(ngModel)]="newTeam.point" name="point" required>
    </mat-form-field><br>

    <button type="button" class="btn btn-success m-5 col-2" (click)="addTeam()">Add teams</button>
  </form>
</div>

<!-- To edit selected teams --> 

<div *ngIf="selectedTeam" class="mt-3">
  <h3>Edit Selected teams</h3>
  <form (ngSubmit)="saveTeam()">
    <mat-form-field>
      <input matInput placeholder="ID" [(ngModel)]="selectedTeam.id" name="id" readonly />
    </mat-form-field><br>
    <mat-form-field>
      <input matInput placeholder="First Name" [(ngModel)]="selectedTeam.name" name="name" />
    </mat-form-field><br>
<mat-form-field>
  <input matInput placeholder="Fuhrer" [(ngModel)]="selectedTeam.fuhrer" name="fuhrer" />
</mat-form-field><br>
    <mat-form-field>
      <mat-label>Select Discipline</mat-label>
      <mat-select [(ngModel)]="selectedDiscipline" name="discipline">
        <mat-option *ngFor="let discipline of allDisciplines" [value]="discipline">
          {{ discipline.name }}
        </mat-option>
      </mat-select>
    </mat-form-field><br>
    <mat-form-field>
      <input matInput placeholder="point" [(ngModel)]="selectedTeam.point" name="point" />
    </mat-form-field><br>

    <button type="submit" class="btn btn-success m-5 col-2">Save</button>
  </form>
</div>
