


<div class="container mt-5">
    <div class="overflow-x-auto">
        <h2 class="text-2xl font-bold mb-4 text-success">Students</h2>
        <table class="table">
            <thead>
        
            <tr class="bg-gray-100 border-b">
                <th class="py-2 px-4 text-left">#</th>
                <th class="py-2 px-4 text-left">Lastname</th>
                <th class="py-2 px-4 text-left">Firstname</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let student of students" class="border-b hover:bg-gray-50 transition-colors duration-200">
                <td class="py-2 px-4">{{ student.last }}</td>
                <td class="py-2 px-4">{{ student.first }}</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="d-flex justify-content-center mt-4">
        <button (click)="prevPage()" [disabled]="page === 1"
                class="btn btn-outline-success">
            Prev
        </button>
        <span class="m-2"> Page {{ page }} of {{ totalPages }} </span>
        <button (click)="nextPage()" [disabled]="page === totalPages"
                class="btn btn-outline-success">
            Next
        </button>
    </div>
</div>
